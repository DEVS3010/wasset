
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def requireSigningProperty = { propertyName ->
    def propertyValue = keystoreProperties[propertyName]
    if (propertyValue == null || propertyValue.toString().trim().isEmpty()) {
        throw new GradleException("Missing '${propertyName}' in android/key.properties. This app must be signed with the Google Play upload key.")
    }
    return propertyValue
}


android {
    namespace 'sa.morph.waseet1'
    compileSdk = 36
    

    signingConfigs {
        release {
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException("Missing android/key.properties. Release builds must use the Google Play upload key.")
            }
            storeFile rootProject.file(requireSigningProperty('storeFile'))
            storePassword requireSigningProperty('storePassword')
            keyAlias requireSigningProperty('keyAlias')
            keyPassword requireSigningProperty('keyPassword')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true

    }

    kotlinOptions {
        // Match Java target with Kotlin jvmTarget
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "sa.morph.waseet1"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 36
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

//    signingConfigs {
//        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
//            release {
//                signingConfig signingConfigs.release
//                minifyEnabled true
//            }
//        } else {
//            release {
//                signingConfig signingConfigs.release
//                minifyEnabled true
//            }
//        }
//    }

    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            applicationIdSuffix ""
            manifestPlaceholders = [appName: "wasset"]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stg"
            manifestPlaceholders = [appName: "[STG] wasset"]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appName: "[DEV] wasset"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

}
